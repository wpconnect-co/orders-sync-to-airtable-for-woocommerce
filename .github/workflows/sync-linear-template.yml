name: Sync Linear readme template

on:
  pull_request:
    paths:
      - readme.txt
      - changelog.txt
      - .github/linear-template.json
      - scripts/sync-linear-template.mjs
      - .github/workflows/sync-linear-template.yml
  push:
    branches:
      - main
    paths:
      - readme.txt
      - changelog.txt
      - .github/linear-template.json
      - scripts/sync-linear-template.mjs
      - .github/workflows/sync-linear-template.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Update the Linear template instead of running a dry-run
        type: boolean
        default: false

jobs:
  sync-linear-template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Linear template sync inputs
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.apply == false)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/sync-linear-template.mjs --dry-run

      - name: Sync Linear template from main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/sync-linear-template.mjs --apply
