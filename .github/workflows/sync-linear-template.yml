name: Sync Linear readme template

on:
  pull_request:
    branches:
      - main
    paths:
      - readme.txt
      - changelog.txt
      - .github/linear-template.json
      - .github/workflows/sync-linear-template.yml
  push:
    branches:
      - main
    paths:
      - readme.txt
      - changelog.txt
      - .github/linear-template.json
      - .github/workflows/sync-linear-template.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Update the Linear template instead of running a dry-run
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-linear-template:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    uses: wpconnect-co/public-github-workflows/.github/workflows/sync-linear-template.yml@main
    with:
      apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true) }}
      require_release_merge: ${{ github.event_name == 'push' }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
